name: Fork surgical fixes validation
permissions: {}

on:
  push:
    branches:
      - ci/frontend-navigation-hotfix
  workflow_dispatch:

concurrency:
  group: fork-display-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend build and browser regressions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src_assets/common/assets/web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src_assets/common/assets/web/package-lock.json
      - name: Install shared legacy UI dependencies
        run: npm ci
        working-directory: src_assets/common/assets/web-legacy
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -g "V2 switch to legacy saves|Windows maintenance uses"

