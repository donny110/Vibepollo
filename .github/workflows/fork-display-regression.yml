name: Fork surgical fixes validation
permissions: {}

on:
  push:
    branches:
      - ci/surgical-fixes-validation
  workflow_dispatch:

concurrency:
  group: fork-display-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend build and browser regressions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src_assets/common/assets/web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src_assets/common/assets/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -g "V2 switch to legacy saves|Windows maintenance uses"

  windows:
    name: Build and run Windows regression tests
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      use_self_hosted: false
      build_only: true
      build_tests: true
      daily_unsigned: false
      release_commit: ${{ github.sha }}
      release_version: 2.0.2
      symbol_product_name: Vibepollo
      symbol_release_prefix: polo
      publish_symbols: false
      upload_symbols_artifact: false
      require_signpath_signing: false
      require_truehdr_runtime: false
      release_artifact_retention_days: 3
